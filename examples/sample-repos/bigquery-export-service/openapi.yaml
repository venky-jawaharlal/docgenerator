openapi: 3.0.3
info:
  title: BigQuery Export Service
  version: 3.0.0
  description: Cloud Run service that exports datasets from BigQuery to GCS.
# Localhost is a placeholder from local development. swagger_gen drops it when
# the config supplies a real deployment host (`host` / `servers`).
servers:
  - url: http://localhost:8080
    description: Local process (do not use for Try-it-out against the deployed service)
paths:
  /exports:
    post:
      operationId: createExport
      summary: Start a new BigQuery export job
      tags: [exports]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Export job accepted
  /exports/{jobId}:
    get:
      operationId: getExport
      summary: Get the status of an export job
      tags: [exports]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
